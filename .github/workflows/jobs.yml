name: Refresh job pages

on:
  # Every day at 10:00, 14:00 and 18:00 Lisbon time. Cron is UTC, so both the summer (UTC+1) and
  # winter (UTC+0) times are scheduled and the "when" job below keeps the one that matches today.
  schedule:
    - cron: "0 9,13,17 * * *"    # Lisbon summer time (WEST)
    - cron: "0 10,14,18 * * *"   # Lisbon winter time (WET)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      simulate_failure:
        description: "Simulate a failure (test the failure email; pages are not touched)"
        type: boolean
        default: false

permissions:
  contents: write           # commit regenerated pages
  pages: write              # request a GitHub Pages rebuild

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Lisbon date +%z)   # +0100 in summer, +0000 in winter
          if [ -z "$SCHEDULE" ] \
             || { [ "$SCHEDULE" = "0 9,13,17 * * *" ] && [ "$offset" = "+0100" ]; } \
             || { [ "$SCHEDULE" = "0 10,14,18 * * *" ] && [ "$offset" = "+0000" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: this UTC slot is not 10:00/14:00/18:00 in Lisbon today (offset $offset)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate job pages from Zoho Recruit
        # Zoho Recruit private API only. On failure the pages are left untouched.
        id: build
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          set -o pipefail
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "Simulated failure requested: hiding ZOHO_REFRESH_TOKEN from the script."
            unset ZOHO_REFRESH_TOKEN
          fi
          log="$RUNNER_TEMP/build.log"
          status=0
          python tools/build_jobs.py 2>&1 | tee "$log" || status=$?
          { echo "log<<EOF_LOG"; tail -n 40 "$log"; echo "EOF_LOG"; } >> "$GITHUB_OUTPUT"
          exit $status

      - name: Commit changes
        id: commit
        run: |
          # sitemap.xml gets a new <lastmod> every run; only commit when job content changed.
          if git diff --quiet -- jobs.html jobs/ && [ -z "$(git ls-files --others --exclude-standard jobs/)" ]; then
            git checkout -- sitemap.xml
            echo "No job changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A jobs.html jobs/ sitemap.xml
          git commit -m "Refresh job pages from Zoho Recruit"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so ask Pages to rebuild explicitly.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed (it may already be building)."

      # Shown on the run page. GitHub's own notification email (Settings > Notifications > Actions)
      # links to it; untick "Only notify for failed workflows" to get an email for every run.
      - name: Run summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          BUILD: ${{ steps.build.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          LOG: ${{ steps.build.outputs.log }}
        run: |
          if [ "$STATUS" != "success" ]; then
            result="❌ Failed: the job pages were not updated. The site still shows the previous version."
          elif [ "$CHANGED" = "true" ]; then
            result="✅ Succeeded: job pages were updated and published."
          else
            result="✅ Succeeded: no changes in Zoho since the last run; nothing to publish."
          fi
          {
            echo "## Job pages refresh"
            echo "$result"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Zoho Recruit API | $BUILD |"
            echo "| Commit | $COMMIT |"
            echo
            echo '```text'
            echo "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
